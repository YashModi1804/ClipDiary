name: Check ClipDiary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: python3 -m unittest discover -s windows/scripts/tests -v
        if: runner.os != 'Windows'
      - run: python -m unittest discover -s windows/scripts/tests -v
        if: runner.os == 'Windows'
      - run: dotnet restore windows/ClipDiary.CoreChecks --locked-mode
      - run: dotnet run --project windows/ClipDiary.CoreChecks -c Release --no-restore -- --stress
      - run: dotnet restore windows/ClipDiary.PlatformChecks --locked-mode
      - run: dotnet run --project windows/ClipDiary.PlatformChecks -c Release --no-restore
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/test.sh --xctest
      - run: ./scripts/package.sh
      - name: Upload the main-branch Mac beta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClipDiary-mac
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore windows/ClipDiary.sln --locked-mode
      - run: dotnet build windows/ClipDiary.sln -c Release --no-restore
      - name: Run native Windows checks on the disposable desktop
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $exe = Join-Path $root 'windows/ClipDiary.Windows/bin/Release/net10.0-windows/ClipDiary.exe'
          $report = Join-Path $root 'artifacts/windows-checks.log'
          $arguments = '--windows-checks --report "' + $report + '"'
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -WorkingDirectory $root -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $report; throw "Windows checks failed with exit code $($process.ExitCode)" }
          Get-Content $report
      - name: Install the open-source installer compiler
        shell: pwsh
        run: |
          choco install nsis --version=3.13 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python windows/scripts/package.py --runtime win-x64 --installer
      - run: python windows/scripts/package.py --runtime win-arm64 --installer
      - name: Upload the main-branch Windows beta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ClipDiary-Windows-beta
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*-Setup.exe
            artifacts/windows/*-SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Keep the synthetic native check report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ClipDiary-Windows-check-log
          path: artifacts/windows-checks.log
          if-no-files-found: ignore
          retention-days: 14
