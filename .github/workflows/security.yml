name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify scanner and scan full history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --location --retry 3 --output "$scan_dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --redact --no-banner --log-opts=--all
